<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--
      아이폰에서 앱처럼 보이게:
      - viewport-fit=cover: 노치·홈 바 영역까지 쓰고, 여백은 safe-area로 맞춘다
      - maximum-scale=1: 작은 입력칸을 누를 때 화면이 자동으로 확대되는 것을 막는다
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <!-- 홈 화면에 추가하면 주소창 없이 전체 화면으로 열린다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="재고관리" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>집 재고관리</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        /* 위아래로 당겼을 때 흰 바탕 대신 앱 바탕색 */
        background-color: #f1f1f5;
      }
      body {
        overflow: hidden;
        /* 당겨서 튕기기·새로고침 막기 */
        overscroll-behavior: none;
        /* 가로 모드에서 글자가 커지지 않게, 글자 가장자리를 또렷하게 */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        /* 길게 누를 때 iOS 복사·찾기 메뉴 대신 앱 메뉴가 뜨도록 */
        -webkit-touch-callout: none;
      }
      #root {
        display: flex;
        /* 주소창이 나타났다 사라져도 화면 높이에 딱 맞게 */
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>이 앱을 쓰려면 JavaScript를 켜 주세요.</noscript>
    <div id="root"></div>
  </body>
</html>
